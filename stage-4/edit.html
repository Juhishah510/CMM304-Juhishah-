<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Vacancy {{ job.id }} — EduJobs Scotland</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-center items-center p-4">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- Header -->
    <div class="px-6 py-5 bg-gradient-to-r from-indigo-900 to-slate-900 text-white flex items-center justify-between">
      <div>
        <span class="text-[11px] font-mono tracking-wider uppercase text-indigo-300">Editing Vacancy</span>
        <h1 class="text-xl font-bold">{{ job.title }} <span class="text-indigo-300 font-mono text-sm">({{ job.id }})</span></h1>
      </div>
      <a href="{{ url_for('index') }}" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center transition text-sm">
        <i class="fa-solid fa-xmark"></i>
      </a>
    </div>

    <!-- Form -->
    <form method="post" class="p-6 space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Job Title</label>
        <input name="title" value="{{ job.title }}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Job Role Type</label>
          <select name="type" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
            {% for t in meta.job_types %}
            <option value="{{ t.id }}" {% if job.type == t.id %}selected{% endif %}>{{ t.label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Employer</label>
          <select name="employer" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
            {% for e in meta.employers %}
            <option value="{{ e.id }}" {% if job.employer == e.id %}selected{% endif %}>{{ e.label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Scottish Location</label>
          <select name="location" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
            {% for l in meta.locations %}
            <option value="{{ l.id }}" {% if job.location == l.id %}selected{% endif %}>{{ l.label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Shift Schedule</label>
          <select name="schedule" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
            {% for s in meta.schedules %}
            <option value="{{ s.id }}" {% if job.schedule == s.id %}selected{% endif %}>{{ s.label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Hourly Pay (£)</label>
          <input type="number" step="0.05" name="hourly_pay" value="{{ job.hourly_pay }}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Hours / Week</label>
          <input type="number" name="hours_per_week" value="{{ job.hours_per_week }}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Requires Experience?</label>
          <select name="requires_experience" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
            <option value="false" {% if job.requires_experience|lower == 'false' %}selected{% endif %}>No (Student-Friendly)</option>
            <option value="true" {% if job.requires_experience|lower == 'true' %}selected{% endif %}>Yes</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Required Competencies (Semicolon-separated)</label>
        <input name="skills" value="{{ job.skills }}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
        <p class="text-[11px] text-slate-400 mt-1">Available: Communication, Teamwork, TimeManagement, CustomerService, CashHandling, FoodHygiene, Multitasking</p>
      </div>

      <!-- Action Buttons -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
        <a href="{{ url_for('index') }}" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 font-semibold transition text-xs">
          Cancel
        </a>
        <button type="submit" class="px-6 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold shadow-md transition text-xs">
          Save Changes &amp; Sync Graph
        </button>
      </div>
    </form>
  </div>

</body>
</html>
