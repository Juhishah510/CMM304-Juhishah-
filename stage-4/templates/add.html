<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Vacancy — EduJobs Scotland</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-center items-center p-4">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- Header -->
    <div class="px-6 py-5 bg-gradient-to-r from-indigo-900 to-slate-900 text-white flex items-center justify-between">
      <div>
        <span class="text-[11px] font-mono tracking-wider uppercase text-indigo-300">New Vacancy</span>
        <h1 class="text-xl font-bold">Add a Job</h1>
      </div>
      <a href="{{ url_for('index') }}" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center transition text-sm">
        <i class="fa-solid fa-xmark"></i>
      </a>
    </div>

    <!-- Form -->
    <form method="post" action="{{ url_for('add') }}" class="p-6 space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Job Title</label>
        <input name="title" required placeholder="e.g. Barista (Weekend)" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Job Type</label>
        <select name="type" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
          <option value="">— Select type —</option>
          {% for t in job_types %}
          <option value="{{ t }}">{{ t }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Employer</label>
        <select name="employer" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
          <option value="">— Select employer —</option>
          {% for e in employers %}
          <option value="{{ e }}">{{ e }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Location</label>
        <select name="location" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
          <option value="">— Select city —</option>
          {% for loc in locations %}
          <option value="{{ loc }}">{{ loc }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Schedule</label>
        <select name="schedule" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
          <option value="">— Select schedule —</option>
          {% for s in schedules %}
          <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Required Skills</label>
        <div class="grid grid-cols-2 gap-1 mt-1">
          {% for skill in skills %}
          <label class="flex items-center gap-2 text-slate-600 font-normal">
            <input type="checkbox" name="skills_multi" value="{{ skill }}" class="rounded">
            {{ skill }}
          </label>
          {% endfor %}
        </div>
        <p class="text-slate-400 mt-1">Or enter manually below (semicolon-separated):</p>
        <input name="skills" placeholder="e.g. Communication;Teamwork" class="w-full px-3 py-2 mt-1 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Hourly Pay (£)</label>
          <input name="hourly_pay" type="number" step="0.01" min="0" required placeholder="e.g. 11.50"
                 class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Hours per Week</label>
          <input name="hours_per_week" type="number" min="1" required placeholder="e.g. 12"
                 class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Requires Experience?</label>
        <select name="requires_experience" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
          <option value="false">No (student-friendly)</option>
          <option value="true">Yes</option>
        </select>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-2.5 rounded-xl transition">
          <i class="fa-solid fa-plus mr-1"></i> Add Vacancy
        </button>
        <a href="{{ url_for('index') }}" class="flex-1 text-center bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm py-2.5 rounded-xl transition">
          Cancel
        </a>
      </div>
    </form>
  </div>

  <p class="text-xs text-slate-400 mt-6">CMM304 Coursework · Juhi Shah</p>
</body>
</html>
